<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echolocation · China Experiences</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f17;--bg2:#111722;--card:#151c28;--line:rgba(214,170,98,.22);--line2:rgba(255,255,255,.1);--gold:#d6aa62;--gold2:#e9c88d;--txt:#f1ece2;--mut:#a9b0bc;--ivory:#f2ede4;--ink:#1a1712;
--serif:"Cormorant Garamond",Georgia,"Songti SC","Noto Serif SC",serif;--sans:Inter,system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
img{display:block;max-width:100%}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.serif{font-family:var(--serif);font-weight:500;letter-spacing:.005em}
.gold{color:var(--gold)}
.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.btn{white-space:nowrap;display:inline-flex;align-items:center;gap:10px;border-radius:6px;padding:12px 22px;font-size:14px;font-weight:500;transition:.2s;border:1px solid transparent;background:none}
.btn.g{background:linear-gradient(180deg,#e2b977,#c9984f);color:#1b1407}
.btn.g:hover{filter:brightness(1.08)}
.btn.o{border-color:rgba(255,255,255,.55);color:#fff}
.btn.o:hover{border-color:var(--gold);color:var(--gold2)}
.btn.ol{border-color:var(--gold);color:var(--gold2)}
.btn.ol:hover{background:var(--gold);color:#1b1407}
.btn.dark{border-color:#b8915a;color:#3a2a10}
.btn.dark:hover{background:#c9984f;color:#1b1407}
.arrow{font-size:16px;line-height:1}

/* header */
header{position:sticky;top:0;z-index:40;background:rgba(11,15,23,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line2)}
.hd{display:flex;align-items:center;gap:28px;height:76px}
.logo{display:flex;flex-direction:row;align-items:center;gap:12px;line-height:1}.logo .mk{height:30px;width:auto}.hd .logo b{font-size:16px;letter-spacing:.26em}.hd .logo small{font-size:7.5px;letter-spacing:.34em}.lang *{white-space:nowrap}.logo .lt{display:flex;flex-direction:column;align-items:center}@media(max-width:560px){.lang svg{display:none}.logo .mk{height:24px}.logo{gap:8px}.hd .logo b{font-size:12.5px;letter-spacing:.2em}.hd .logo small{font-size:6px;letter-spacing:.26em}}
.logo b{font-family:var(--sans);font-weight:400;letter-spacing:.32em;font-size:19px}
.logo small{margin-top:6px;font-size:8.5px;letter-spacing:.42em;color:var(--gold);text-transform:uppercase}
.sep{width:1px;height:34px;background:var(--line2)}
nav.main{display:flex;gap:22px;font-size:13.5px;white-space:nowrap;color:#d8dbe2;flex:1;justify-content:center}
nav.main a{padding:6px 0;border-bottom:1px solid transparent}
nav.main a:hover,nav.main a.on{color:var(--gold2);border-color:var(--gold)}
.lang{position:relative;font-size:13px;color:#d8dbe2}
.lang button{background:none;border:0;padding:6px 8px;color:inherit;cursor:pointer;font:inherit}
.lang .lcur{display:flex;align-items:center;gap:7px;border-radius:99px}.lang .lcur:hover{background:rgba(255,255,255,.08)}
.lang .lcur.on .car{transform:rotate(180deg)}
.lmenu{display:none;position:absolute;inset-inline-end:0;top:calc(100% + 8px);min-width:170px;margin:0;padding:6px 0;list-style:none;background:#fff;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.35);z-index:80}
.lmenu.open{display:block}.lmenu button{display:flex;width:100%;justify-content:space-between;padding:10px 16px;color:#14161b;text-align:start}
.lmenu button:hover{background:#f3f3f1}.lmenu button[aria-pressed=true]{font-weight:600}.lmenu button[aria-pressed=true]::after{content:'✓'}
.burger{display:none;background:none;border:0;width:40px;height:40px}
.burger i{display:block;width:20px;height:1px;background:#fff;margin:5px auto}
.logo b{white-space:nowrap}@media(max-width:420px){.logo b{font-size:15px;letter-spacing:.26em}.logo small{font-size:7.5px}}
.mnav{display:none;border-top:1px solid var(--line2);padding:8px 24px 20px}
.mnav a{display:block;padding:14px 0;border-bottom:1px solid var(--line2);font-family:var(--serif);font-size:22px}
@media(max-width:1120px){.hd{gap:12px}.hd .lang{margin-left:auto}nav.main,.hd .sep,.hd .plan{display:none}.burger{display:block}.hd{justify-content:space-between}.mnav.open{display:block}}

/* hero */
.hero{position:relative;overflow:hidden;min-height:560px;display:flex;align-items:center}
.hero .bg{position:absolute;inset:0 0 0 30%}
.hero .s{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transform:scale(1.06);transition:opacity 1.6s ease,transform 7s linear}
.hero .s.on{opacity:1;transform:scale(1)}
.hdots{position:absolute;z-index:3;left:0;right:0;bottom:26px;display:flex;justify-content:flex-end;gap:8px;max-width:1200px;margin:0 auto;padding:0 24px}
.hdots button{width:26px;height:3px;border:0;padding:0;background:rgba(255,255,255,.3);border-radius:2px}
.hdots button.on{background:var(--gold)}
@media(prefers-reduced-motion:reduce){.hero .s{transition:none;transform:none}}
.hero:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,var(--bg) 30%,rgba(11,15,23,.75) 48%,rgba(11,15,23,.1) 75%,rgba(11,15,23,.35)),linear-gradient(0deg,var(--bg),transparent 14%)}
.hero .in{position:relative;z-index:2;padding:90px 0 100px;max-width:560px}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(44px,6.4vw,76px);line-height:1;margin:0 0 22px}
.hero h1 em{font-style:normal;color:var(--gold)}
html[lang=zh] .hero h1{font-size:clamp(38px,5vw,62px);letter-spacing:.02em}html[lang=zh] .sh h2,html[lang=zh] .b-top h2{letter-spacing:.03em}
.hero p{font-size:17px;color:#d9dce3;margin:0 0 30px;max-width:44ch}
.row{display:flex;gap:14px;flex-wrap:wrap}
@media(max-width:760px){.hero .bg{inset:0;opacity:.55}.hero:before{background:linear-gradient(0deg,var(--bg) 8%,rgba(11,15,23,.55))}}

/* feature cards */
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px;position:relative;z-index:3}
@media(max-width:860px){.feat{grid-template-columns:1fr}}
.fc{position:relative;display:block;border:1px solid var(--line);border-radius:12px;overflow:hidden;aspect-ratio:16/11;background:var(--card)}
.fc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1s}
.fc:hover img{transform:scale(1.04)}
.fc:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(8,11,17,.95) 8%,rgba(8,11,17,.35) 55%,transparent)}
.fc .tx{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:20px 22px;display:grid;grid-template-columns:40px 1fr 20px;gap:14px;align-items:end}
.fc .ic{color:var(--gold)}
.fc h3{margin:0 0 4px;font-family:var(--sans);font-weight:400;font-size:19px}
.fc p{margin:0;font-size:13px;color:#c8ccd4;line-height:1.4}
.ext{position:absolute;top:12px;right:12px;z-index:2;font-size:11px;letter-spacing:.08em;background:rgba(11,15,23,.7);border:1px solid var(--line);padding:4px 9px;border-radius:999px;color:var(--gold2)}

.trust{display:grid;grid-template-columns:repeat(4,1fr);margin:26px 0 0;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.trust div{display:flex;align-items:center;gap:12px;justify-content:center;padding:18px 10px;font-size:13.5px;color:#dfe2e8}
.trust div+div{border-left:1px solid var(--line2)}
.trust svg{color:var(--gold);flex:none}
@media(max-width:860px){.trust{grid-template-columns:1fr 1fr}.trust div:nth-child(3){border-left:0}.trust div:nth-child(n+3){border-top:1px solid var(--line2)}}

/* packages */
section{scroll-margin-top:80px}
.sh{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin:70px 0 26px}
.sh h2{font-family:var(--serif);font-weight:400;font-size:clamp(34px,4.6vw,50px);margin:0;line-height:1.05}
.sh p{margin:8px 0 0;color:#cdd1d8}
.link{color:var(--gold2);font-size:14px;border-bottom:1px solid var(--gold);padding-bottom:2px;background:none;border-top:0;border-left:0;border-right:0}
.pk{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:960px){.pk{grid-template-columns:1fr 1fr}}@media(max-width:520px){.pk{grid-template-columns:1fr}}
.pc{position:relative;text-align:left;border:1px solid var(--line);border-radius:10px;overflow:hidden;aspect-ratio:4/3.4;background:var(--card);padding:0}
.pc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1s}
.pc:hover img{transform:scale(1.05)}
.pc:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(8,11,17,.94) 10%,rgba(8,11,17,.2) 58%,transparent)}
.pc .tx{position:absolute;inset:auto 0 0 0;z-index:2;padding:18px 18px 16px}
.pc .ic{color:var(--gold);margin-bottom:8px}
.pc h3{margin:0 0 4px;font-weight:400;font-size:18px}
.pc p{margin:0;font-size:13px;color:#c8ccd4;line-height:1.4;padding-right:28px}
.pc .arrow{position:absolute;right:16px;bottom:18px;z-index:2}

/* 360 band */
.band{position:relative;margin-top:70px;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);overflow:hidden}
.band .bg{position:absolute;inset:0 0 0 52%;background:url(img/wall.webp) center/cover}
.band:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,var(--bg) 52%,rgba(11,15,23,.55) 66%,rgba(11,15,23,.05))}
.band .in{position:relative;z-index:2;padding:46px 0 34px}
.b-top{display:grid;grid-template-columns:300px 1fr;gap:40px;align-items:center;max-width:820px}
.b-top h2{font-family:var(--serif);font-weight:400;font-size:clamp(34px,4vw,46px);line-height:1;margin:10px 0 0}
.b-top h2:after{content:"";display:block;width:34px;height:2px;background:var(--gold);margin-top:16px}
.b-top>p{margin:0;padding-left:30px;border-left:1px solid var(--line2);color:#d9dce3}
.icons{display:grid;grid-template-columns:repeat(5,1fr);max-width:720px;margin-top:32px}
.icons div{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;font-size:13px;line-height:1.35;color:#e3e5ea;padding:4px 8px}
.icons div+div{border-left:1px solid var(--line2)}
.icons svg{display:block;flex:none;color:var(--gold);margin:0 0 10px}
@media(max-width:760px){.band .bg{inset:0;opacity:.3}.band:before{background:rgba(11,15,23,.6)}.b-top{grid-template-columns:1fr;gap:16px}.b-top>p{padding-left:0;border:0}.icons{grid-template-columns:repeat(3,1fr);row-gap:18px}.icons div:nth-child(4){border-left:0}}

/* private services (light) */
.light{background:linear-gradient(90deg,#f4efe6,#efe8dc);color:var(--ink);position:relative;overflow:hidden}
.light .bimg{position:absolute;right:0;bottom:0;top:0;width:200px;background:url(img/building.webp) center/cover;-webkit-mask:linear-gradient(90deg,transparent,#000 60%);mask:linear-gradient(90deg,transparent,#000 60%)}
.lg{display:grid;grid-template-columns:1.1fr 1.4fr;gap:30px;align-items:center;padding:40px 220px 40px 0;position:relative}
.lg h2{font-family:var(--serif);font-weight:500;font-size:clamp(30px,3.4vw,38px);margin:0 0 8px;color:#18140d}
.lg p{margin:0 0 20px;color:#5b5346}
.svc{display:grid;grid-template-columns:repeat(3,1fr)}
.svc div{display:flex;flex-direction:column;align-items:center;line-height:1.35;text-align:center;font-size:14px;color:#2a241a;padding:6px 14px;border-left:1px solid rgba(60,45,20,.15)}
.svc svg{display:block;flex:none;color:#3a2c14;margin:0 0 10px}
@media(max-width:900px){.lg{grid-template-columns:1fr;padding-right:0}.light .bimg{display:none}}

/* cta */
.cta{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 50% 120%,#2a2418,#0b0f17 60%)}
.cta .in{display:flex;align-items:center;justify-content:center;gap:50px;padding:46px 0;flex-wrap:wrap;text-align:center}
.cta h2{font-family:var(--serif);font-weight:400;font-size:clamp(28px,3.4vw,38px);margin:0 0 6px}
.cta h2 em{font-style:normal;color:var(--gold)}
.cta p{margin:0;color:#d4d7dd}

/* rev8 strip */
.rev{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:70px;background:var(--card)}
.rev .im{min-height:300px;background:url(img/rev8.webp) center/cover}
.rev .tx{padding:38px}
.rev h2{font-family:var(--serif);font-weight:400;font-size:clamp(30px,3.4vw,42px);margin:10px 0 12px;line-height:1.05}
.rev p{color:#cdd1d8;margin:0 0 24px}
@media(max-width:760px){.rev{grid-template-columns:1fr}.rev .im{min-height:220px}}

/* footer */
footer{border-top:1px solid var(--line2);margin-top:0}
.ft{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:30px;padding:46px 0}
.ft>div+div{border-left:1px solid var(--line2);padding-left:30px}
.ft h4{margin:0 0 12px;color:var(--gold);font-weight:500;font-size:13px}
.ft .logo{display:flex}.ft button{background:none;border:0;padding:0;font-size:13.5px}
.ft a,.ft span{display:block;font-size:13.5px;color:#d4d7dd;margin:0 0 6px;background:none;border:0;padding:0;text-align:left}
.ft a:hover{color:var(--gold2)}
@media(max-width:760px){.ft{grid-template-columns:1fr}.ft>div+div{border-left:0;padding-left:0}}
.copy{border-top:1px solid var(--line2);padding:16px 0;font-size:12px;color:#7d8491}

/* modal */
.mod{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding:16px}
.mod.open{display:flex}
.box{background:#121926;border:1px solid var(--line);border-radius:14px;max-width:520px;width:100%;padding:28px;max-height:92vh;overflow:auto;position:relative}
.box h3{font-family:var(--serif);font-weight:400;font-size:30px;margin:0 0 6px}
.box .x{position:absolute;right:14px;top:12px;background:none;border:0;font-size:20px;color:var(--mut)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.fg label{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.fg .w{grid-column:1/-1}
.fg input,.fg select,.fg textarea{display:block;width:100%;margin-top:6px;background:#0c121c;border:1px solid var(--line2);border-radius:6px;color:#fff;padding:10px 12px;font:inherit;font-size:15px;text-transform:none;letter-spacing:0}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--gold)}
.err{color:#f0a3a3;font-size:13px;margin:12px 0 0;min-height:1em}
.note{font-size:12px;color:#7d8491;margin-top:14px}
</style>
</head>
<body>

<header>
  <div class="wrap hd">
    <a class="logo" href="#top" aria-label="Echolocation Trip"><img class="mk" src="img/logo-mark.webp" alt=""><span class="lt"><b>ECHOLOCATION</b><small>– China Experiences –</small></span></a>
    <span class="sep"></span>
    <nav class="main">
      <a href="#top" class="on" data-k="nHome"></a>
      <a href="#packages" data-k="nPackages"></a>
      <a href="#experience" data-k="nExp"></a>
      <a href="#rev8" data-k="nRev8"></a>
      <a href="#business" data-k="nBiz"></a>
      <a href="#about" data-k="nAbout"></a>
    </nav>
    <div class="lang" id="langdd">
      <button class="lcur" aria-haspopup="listbox" aria-expanded="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg><span id="lname">English</span><svg class="car" width="9" height="6" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 1l4 4 4-4"/></svg></button>
      <ul class="lmenu" role="listbox"><li><button data-l="en">English</button></li><li><button data-l="zh">中文</button></li><li><button data-l="ru">Русский</button></li><li><button data-l="es">Español</button></li><li><button data-l="ar" dir="rtl">العربية</button></li></ul>
    </div>
    <button class="btn ol plan" data-plan><span data-k="plan"></span><span class="arrow">→</span></button>
    <button class="burger" aria-label="Menu"><i></i><i></i></button>
  </div>
  <div class="mnav">
    <a href="#packages" data-k="nPackages"></a><a href="#experience" data-k="nExp"></a><a href="#rev8" data-k="nRev8"></a><a href="#business" data-k="nBiz"></a><a href="#about" data-k="nAbout"></a>
    <button class="btn g" style="margin-top:18px;width:100%;justify-content:center" data-plan><span data-k="plan"></span></button>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="bg" aria-hidden="true">
      <div class="s on" style="background-image:url(img/hero.webp)"></div>
      <div class="s" style="background-image:url(img/sh2.webp);background-position:50% 55%"></div>
      <div class="s" style="background-image:url(img/sh3.webp);background-position:50% 62%"></div>
    </div>
    <div class="hdots"><button class="on" aria-label="1"></button><button aria-label="2"></button><button aria-label="3"></button></div>
    <div class="wrap" style="width:100%">
      <div class="in">
        <h1 data-k="heroTitle"></h1>
        <p data-k="heroSub"></p>
        <div class="row">
          <a class="btn g" href="#packages"><span data-k="ctaPackages"></span><span class="arrow">→</span></a>
          <a class="btn o" href="#experience"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z" fill="currentColor"/></svg><span data-k="ctaDiscover"></span></a>
        </div>
      </div>
    </div>
  </section>

  <div class="wrap">
    <div class="feat">
      <a class="fc" href="#packages"><img src="img/pkg-allin.webp" alt=""><div class="tx">
        <svg class="ic" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 3l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5M3 16.5l9 4.5 9-4.5"/></svg>
        <div><h3 data-k="f1t"></h3><p data-k="f1p"></p></div><span class="arrow">→</span></div></a>
      <a class="fc" href="#experience"><img src="img/exp.webp" alt=""><div class="tx">
        <svg class="ic" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 20c-4 0-8-3-8-8 2 0 5 1 8 4 3-3 6-4 8-4 0 5-4 8-8 8z"/><path d="M12 16c-2-3-2-7 0-11 2 4 2 8 0 11z"/></svg>
        <div><h3 data-k="f2t"></h3><p data-k="f2p"></p></div><span class="arrow">→</span></div></a>
      <a class="fc" href="#rev8"><img src="img/mobility.webp" alt="" style="object-position:50% 70%"><span class="ext">REV8 Cars</span><div class="tx">
        <svg class="ic" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 15l2-6c.4-1.2 1.4-2 2.7-2h8.6c1.3 0 2.3.8 2.7 2l2 6v3H3z"/><circle cx="7.5" cy="15.5" r="1.3"/><circle cx="16.5" cy="15.5" r="1.3"/></svg>
        <div><h3 data-k="f3t"></h3><p data-k="f3p"></p></div><span class="arrow">→</span></div></a>
    </div>

    <div class="trust">

let lang; try{lang=localStorage.getItem('echo-lang')}catch(e){} if(!D[lang]) lang='en';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

function renderPkgs(){
  $('#pkgrid').innerHTML = PKGS.map(p=>{const [t,d]=D[lang]['p_'+p.id];return `<button class="pc" data-plan="${p.id}"><img src="${p.img}" alt="" loading="lazy"><div class="tx"><svg class="ic" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">${p.icon}</svg><h3>${t}</h3><p>${d}</p></div><span class="arrow">→</span></button>`}).join('');
  bindPlan();
}
function renderInterest(sel){
  const t=D[lang];
  const opts=[['general',t.opt_general],...PKGS.map(p=>[p.id,t['p_'+p.id][0]]),['proposal',t.opt_proposal],['cars',t.opt_cars]];
  $('#interest').innerHTML=opts.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
  if(sel) $('#interest').value=sel;
}
function apply(){
  document.documentElement.lang=lang; document.documentElement.dir=lang==='ar'?'rtl':'ltr'; $('#lname').textContent=({en:'English',zh:'中文',ru:'Русский',es:'Español',ar:'العربية'})[lang];
  $$('[data-k]').forEach(el=>{const v=D[lang][el.dataset.k]??D.en[el.dataset.k]; if(typeof v==='string') el.innerHTML=v;});
  $$('.lmenu button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  renderPkgs(); renderInterest($('#interest').value);
  try{localStorage.setItem('echo-lang',lang)}catch(e){}
}
function openPlan(sel){
  $('#formView').hidden=false; $('#okView').hidden=true; $('#err').textContent='';
  renderInterest(sel||'general'); $('#mod').classList.add('open'); document.body.style.overflow='hidden';
}
function closePlan(){ $('#mod').classList.remove('open'); document.body.style.overflow=''; }
function bindPlan(){ $$('[data-plan]').forEach(b=>{ b.onclick=e=>{ e.preventDefault(); $('.mnav').classList.remove('open'); openPlan(b.dataset.plan); }; }); }

$('.lcur').onclick=e=>{e.stopPropagation();const o=$('.lmenu').classList.toggle('open');$('.lcur').classList.toggle('on',o);$('.lcur').setAttribute('aria-expanded',o);};
$$('.lmenu button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;apply();$('.lmenu').classList.remove('open');$('.lcur').classList.remove('on');});
addEventListener('click',()=>{$('.lmenu').classList.remove('open');$('.lcur').classList.remove('on');});
$('#cpwc').onclick=async()=>{try{await navigator.clipboard.writeText('+86 191 2118 9461')}catch(e){} $('#cpwc').textContent=D[lang].cCopied??D.en.cCopied; setTimeout(()=>$('#cpwc').textContent=D[lang].cCopy,1600);};
$('.burger').onclick=()=>$('.mnav').classList.toggle('open');
$$('.mnav a').forEach(a=>a.onclick=()=>$('.mnav').classList.remove('open'));
$$('[data-close]').forEach(b=>b.onclick=closePlan);
$('#mod').onclick=e=>{ if(e.target.id==='mod') closePlan(); };
addEventListener('keydown',e=>{ if(e.key==='Escape') closePlan(); });

const FORM_ENDPOINT='https://script.google.com/macros/s/AKfycbxFx4JJ7RHyameeDl7-Pb17rz3J7Ke2kvAcyRdE7OPoIf3YfOENEm6jYG_Wd196N4zi/exec'; // Google Apps Script web-app URL (e-mails the team; destination addresses stay inside the script)
const FAILMSG={en:'We could not send your request. Please try again or contact us on WhatsApp.',es:'No hemos podido enviar tu solicitud. Inténtalo de nuevo o escríbenos por WhatsApp.',zh:'发送失败，请重试或通过 WhatsApp 联系我们。',ru:'Не удалось отправить заявку. Попробуйте ещё раз или напишите нам в WhatsApp.',ar:'تعذّر إرسال طلبك. حاول مرة أخرى أو راسلنا عبر واتساب.'};
let sending=false;
$('#planForm').onsubmit=async e=>{
  e.preventDefault(); if(sending) return; const f=new FormData(e.target);
  if(!String(f.get('name')).trim()||!String(f.get('email')).trim()){ $('#err').textContent=D[lang].req; return; }
  $('#err').textContent='';
  if(String(f.get('website')||'')==='' && FORM_ENDPOINT){
    sending=true;
    try{
      const fields={}; ['name','email','phone','interest','from','people','msg'].forEach(k=>fields[k]=String(f.get(k)||''));
      await fetch(FORM_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({site:'Echolocation Trip',ref:'ECHO-'+Math.random().toString(36).slice(2,7).toUpperCase(),lang,page:location.href,fields})});
    }catch(_){ sending=false; $('#err').textContent=FAILMSG[lang]||FAILMSG.en; return; }
    sending=false;
  }
  $('#formView').hidden=true; $('#okView').hidden=false;
};
// highlight current section in nav
const secs=['top','packages','experience','business','rev8','about'].map(id=>document.getElementById(id));
addEventListener('scroll',()=>{ let cur='top'; secs.forEach(s=>{ if(s && s.getBoundingClientRect().top<120) cur=s.id; });
  $$('nav.main a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+cur)); },{passive:true});
apply();
// hero slideshow
(()=>{const sl=$$('.hero .s'),dots=$$('.hdots button');let i=0,t;
 const show=n=>{i=n;sl.forEach((s,k)=>s.classList.toggle('on',k===i));dots.forEach((d,k)=>d.classList.toggle('on',k===i));};
 const run=()=>{clearInterval(t);t=setInterval(()=>show((i+1)%sl.length),5500);};
 dots.forEach((d,k)=>d.onclick=()=>{show(k);run();});run();})();
</script>
