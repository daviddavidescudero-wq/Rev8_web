u043E\u0439 \u043B\u0438\u0432\u0440\u0435\u0435: \u0433\u0438\u0431\u0440\u0438\u0434\u043D\u0430\u044F \u043C\u043E\u0449\u044C \u0438 \u043D\u0435\u0431\u043E \u0432\u043C\u0435\u0441\u0442\u043E \u043A\u0440\u044B\u0448\u0438.","Twin-turbo V8 and a retractable hard top, in a yellow made for Shanghai sunshine.":"\u0411\u0438\u0442\u0443\u0440\u0431\u043E V8 \u0438 \u0441\u043A\u043B\u0430\u0434\u043D\u043E\u0439 \u0436\u0451\u0441\u0442\u043A\u0438\u0439 \u0432\u0435\u0440\u0445 \u0432 \u0436\u0451\u043B\u0442\u043E\u043C \u0446\u0432\u0435\u0442\u0435, \u0441\u043E\u0437\u0434\u0430\u043D\u043D\u043E\u043C \u0434\u043B\u044F \u0448\u0430\u043D\u0445\u0430\u0439\u0441\u043A\u043E\u0433\u043E \u0441\u043E\u043B\u043D\u0446\u0430.","The classic: Rosso Ferrari, a twin-turbo V8 and open-air driving after dark.":"\u041A\u043B\u0430\u0441\u0441\u0438\u043A\u0430: Rosso Ferrari, \u0431\u0438\u0442\u0443\u0440\u0431\u043E V8 \u0438 \u043F\u043E\u0435\u0437\u0434\u043A\u0438 \u0441 \u043E\u0442\u043A\u0440\u044B\u0442\u044B\u043C \u0432\u0435\u0440\u0445\u043E\u043C \u0442\u0451\u043C\u043D\u044B\u043C \u0432\u0435\u0447\u0435\u0440\u043E\u043C.","Front-mounted V12 grand touring at its most extreme, in red with yellow racing stripes.":"\u0413\u0440\u0430\u043D-\u0442\u0443\u0440\u0438\u0437\u043C\u043E \u0441 \u043F\u0435\u0440\u0435\u0434\u043D\u0438\u043C V12 \u0432 \u0441\u0430\u043C\u043E\u043C \u044D\u043A\u0441\u0442\u0440\u0435\u043C\u0430\u043B\u044C\u043D\u043E\u043C \u0438\u0441\u043F\u043E\u043B\u043D\u0435\u043D\u0438\u0438: \u043A\u0440\u0430\u0441\u043D\u044B\u0439 \u043A\u0443\u0437\u043E\u0432 \u0438 \u0436\u0451\u043B\u0442\u044B\u0435 \u0433\u043E\u043D\u043E\u0447\u043D\u044B\u0435 \u043F\u043E\u043B\u043E\u0441\u044B.","A hypercar icon in Martini racing livery. One of the rarest drives in the city.":"\u0418\u043A\u043E\u043D\u0430 \u0433\u0438\u043F\u0435\u0440\u043A\u0430\u0440\u043E\u0432 \u0432 \u0433\u043E\u043D\u043E\u0447\u043D\u043E\u0439 \u043B\u0438\u0432\u0440\u0435\u0435 Martini. \u041E\u0434\u043D\u0430 \u0438\u0437 \u0441\u0430\u043C\u044B\u0445 \u0440\u0435\u0434\u043A\u0438\u0445 \u043C\u0430\u0448\u0438\u043D \u0433\u043E\u0440\u043E\u0434\u0430.","Motorsport engineering for the road: swan-neck wing, 9,000 rpm and pure precision.":"\u0422\u0435\u0445\u043D\u043E\u043B\u043E\u0433\u0438\u0438 \u0430\u0432\u0442\u043E\u0441\u043F\u043E\u0440\u0442\u0430 \u0434\u043B\u044F \u0434\u043E\u0440\u043E\u0433: \u0430\u043D\u0442\u0438\u043A\u0440\u044B\u043B\u043E \u043D\u0430 \xAB\u043B\u0435\u0431\u0435\u0434\u0438\u043D\u043E\u0439 \u0448\u0435\u0435\xBB, 9 000 \u043E\u0431/\u043C\u0438\u043D \u0438 \u0431\u0435\u0437\u0443\u043F\u0440\u0435\u0447\u043D\u0430\u044F \u0442\u043E\u0447\u043D\u043E\u0441\u0442\u044C.","The darker, more assertive Cullinan. Effortless presence for business and celebration alike.":"\u0411\u043E\u043B\u0435\u0435 \u0442\u0451\u043C\u043D\u044B\u0439 \u0438 \u0434\u0435\u0440\u0437\u043A\u0438\u0439 Cullinan. \u0423\u0432\u0435\u0440\u0435\u043D\u043D\u043E\u0435 \u043F\u0440\u0438\u0441\u0443\u0442\u0441\u0442\u0432\u0438\u0435 \u0438 \u0434\u043B\u044F \u0434\u0435\u043B\u043E\u0432\u044B\u0445 \u0432\u0441\u0442\u0440\u0435\u0447, \u0438 \u0434\u043B\u044F \u043F\u0440\u0430\u0437\u0434\u043D\u0438\u043A\u043E\u0432.","Black Badge character with Forged Yellow details. Arrive anywhere, unmistakably.":"\u0425\u0430\u0440\u0430\u043A\u0442\u0435\u0440 Black Badge \u0438 \u0430\u043A\u0446\u0435\u043D\u0442\u044B \u0446\u0432\u0435\u0442\u0430 Forged Yellow. \u0412\u0430\u0441 \u0443\u0437\u043D\u0430\u044E\u0442 \u0432\u0435\u0437\u0434\u0435.","Serene, commanding and finished with a striking blue cabin.":"\u0421\u043F\u043E\u043A\u043E\u0439\u043D\u044B\u0439, \u0432\u0435\u043B\u0438\u0447\u0435\u0441\u0442\u0432\u0435\u043D\u043D\u044B\u0439, \u0441 \u044D\u0444\u0444\u0435\u043A\u0442\u043D\u044B\u043C \u0441\u0438\u043D\u0438\u043C \u0441\u0430\u043B\u043E\u043D\u043E\u043 B\u3002\u65B0\u4E00\u4EE3\u4E2D\u7F6E\u5F15\u64CE\u6CD5\u62C9\u5229\u8DD1\u8F66\u3002","The open-top 296 in black and gold livery: hybrid performance with the sky as the roof.":"\u9ED1\u91D1\u6D82\u88C5\u7684\u655E\u7BF7 296\uFF1A\u4EE5\u5929\u7A7A\u4E3A\u9876\u7684\u6DF7\u52A8\u6027\u80FD\u3002","Twin-turbo V8 and a retractable hard top, in a yellow made for Shanghai sunshine.":"\u53CC\u6DA1\u8F6E\u589E\u538B V8 \u4E0E\u53EF\u6536\u6298\u786C\u9876\uFF0C\u4E00\u62B9\u4E3A\u4E0A\u6D77\u9633\u5149\u800C\u751F\u7684\u9EC4\u8272\u3002","The classic: Rosso Ferrari, a twin-turbo V8 and open-air driving after dark.":"\u7ECF\u5178\u4E4B\u9009\uFF1A\u6CD5\u62C9\u5229\u7EA2\u3001\u53CC\u6DA1\u8F6E\u589E\u538B V8\uFF0C\u591C\u8272\u4E2D\u655E\u7BF7\u9A70\u9A8B\u3002","Front-mounted V12 grand touring at its most extreme, in red with yellow racing stripes.":"\u524D\u7F6E V12 \u7684\u6781\u81F4 GT\uFF0C\u7EA2\u8272\u8F66\u8EAB\u914D\u9EC4\u8272\u8D5B\u9053\u6761\u7EB9\u3002","A hypercar icon in Martini racing livery. One of the rarest drives in the city.":"\u9A6C\u5929\u5C3C\u8D5B\u8F66\u6D82\u88C5\u7684\u8D85\u8DD1\u4F20\u5947\uFF0C\u57CE\u4E2D\u6700\u7A00\u6709\u7684\u9A7E\u9A76\u4F53\u9A8C\u4E4B\u4E00\u3002","Motorsport engineering for the road: swan-neck wing, 9,000 rpm and pure precision.":"\u516C\u8DEF\u4E0A\u7684\u8D5B\u8F66\u5DE5\u7A0B\uFF1A\u9E45\u9888\u5C3E\u7FFC\u30019,000 \u8F6C\u4E0E\u7EAF\u7CB9\u7684\u7CBE\u51C6\u3002","The darker, more assertive Cullinan. Effortless presence for business and celebration alike.":"\u66F4\u6DF1\u9083\u3001\u66F4\u9738\u6C14\u7684\u5E93\u91CC\u5357\u3002\u65E0\u8BBA\u5546\u52A1\u8FD8\u662F\u5E86\u5178\uFF0C\u6C14\u573A\u81EA\u6210\u3002","Black Badge character with Forged Yellow details. Arrive anywhere, unmistakably.":"Black Badge \u7684\u6027\u683C\uFF0C\u642D\u914D\u953B\u9020\u9EC4\u7EC6\u8282\u3002\u6240\u5230\u4E4B\u5904\uFF0C\u8FA8\u8BC6\u5EA6\u6EE1\u5206\u3002","Serene, commanding and finished with a striking blue cabin.":"\u6C89\u7A33\u5927\u6C14\uFF0C\u914D\u4EE5\u593A\u76EE\u7684\u84DD\u8272\u5185\u9970\u3002","Updated with the latest Cullinan design, including the illuminated grille.":"\u91C7\u7528\u6700\u65B0\u5E93\u91CC\u5357\u8BBE\u8BA1\uFF0C\u5305\u62EC\u53EF\u70B9\u4EAE\u7684\u683C\u6805\u3002","Ferrari\u2019s first four-door, four-seater, with a naturally aspirated V12 at its heart.":"\u6CD5\u62C9\u5229\u9996\u6B3E\u56DB\u95E8\u56DB\u5EA7\u8F66\u578B\uFF0C\u642D\u8F7D\u81EA\u7136\u5438\u6C14 V12\u3002","A super SUV with Lamborghini DNA: space for the family, performance for the driver.":"\u6D41\u6DCC\u5170\u535A\u57FA\u5C3C\u8840\u7EDF\u7684\u8D85\u7EA7 SUV\uFF1A\u5BB6\u4EBA\u6709\u7A7A\u95F4\uFF0C\u9A7E\u9A76\u8005\u6709\u6027\u80FD\u3002","British elegance with a sporting edge, made for long days in and around the city.":"\u82F1\u4F26\u4F18\u96C5\u517C\u5177\u8FD0\u52A8\u6C14\u8D28\uFF0C\u9002\u5408\u5E02\u533A\u53CA\u5468\u8FB9\u7684\u5168\u5929\u51FA\u884C\u3002","Commanding, refined and discreet. A composed choice for business and family travel.":"\u6C14\u5EA6\u4E0D\u51E1\u3001\u7CBE\u81F4\u4F4E\u8C03\u3002\u5546\u52A1\u4E0E\u5BB6\u5EAD\u51FA\u884C\u7684\u4ECE\u5BB9\u4E4B\u9009\u3002","The icon, in its most powerful form. Unmistakable on any street.":"\u7ECF\u5178\u8F66\u578B\u7684\u6700\u5F3A\u5F62\u6001\uFF0C\u5728\u4EFB\u4F55\u8857\u9053\u90FD\u8FA8\u8BC6\u5EA6\u5341\u8DB3\u3002","Timeless G-Class design with everyday comfort.":"\u7ECF\u5178\u6C38\u6052\u7684 G \u7EA7\u8BBE\u8BA1\uFF0C\u517C\u5177\u65E5\u5E38\u8212\u9002\u3002","Two-tone Maybach luxury with a first-class rear cabin.":"\u8FC8\u5DF4\u8D6B\u53CC\u8272\u5962\u534E\uFF0C\u540E\u6392\u4EAB\u53D7\u5934\u7B49\u8231\u4F53\u9A8C\u3002","Open-air serenity. Ideal for weddings, celebrations and golden-hour drives along the Bund.":"\u655E\u7BF7\u7684\u5B81\u9759\u4E4B\u7F8E\u3002\u5A5A\u793C\u3001\u5E86\u5178\u6216\u9EC4\u660F\u65F6\u5206\u6CBF\u5916\u6EE9\u515C\u98CE\u7684\u7406\u60F3\u4E4B\u9009\u3002","The four-seat Rolls-Royce convertible in a two-tone finish.":"\u53CC\u8272\u6D82\u88C5\u7684\u52B3\u65AF\u83B1\u65AF\u56DB\u5EA7\u655E\u7BF7\u8F66\u3002","Hand-finished craftsmanship and effortless power for occasions that deserve more.":"\u624B\u5DE5\u7CBE\u5236\u5DE5\u827A\u4E0E\u4ECE\u5BB9\u52A8\u529B\uFF0C\u4E3A\u91CD\u8981\u573A\u5408\u800C\u751F\u3002","Six-cylinder M performance with the roof down, in a striking green.":"\u655E\u7BF7\u4EAB\u53D7\u516D\u7F38 M \u6027\u80FD\uFF0C\u9192\u76EE\u7684\u7EFF\u8272\u8F66\u8EAB\u3002","Understated, whisper-quiet luxury. The executive\u2019s Rolls-Royce.":"\u4F4E\u8C03\u9759\u8C27\u7684\u5962\u534E\uFF0C\u5546\u52A1\u7CBE\u82F1\u7684\u52B3\u65AF\u83B1\u65AF\u3002","A grand saloon with a sporting soul and a beautifully crafted rear cabin.":"\u517C\u5177\u8FD0\u52A8\u7075\u9B42\u7684\u8C6A\u534E\u8F7F\u8F66\uFF0C\u540E\u6392\u505A\u5DE5\u7CBE\u7F8E\u3002","Contemporary luxury and technology for business days in the city.":"\u5F53\u4EE3\u5962\u534E\u4E0E\u79D1\u6280\uFF0C\u4E3A\u57CE\u4E2D\u5546\u52A1\u884C\u7A0B\u800C\u751F\u3002","First-class comfort for groups, airport transfers and executive travel.":"\u5934\u7B49\u8231\u822C\u7684\u8212\u9002\uFF0C\u9002\u5408\u56E2\u961F\u51FA\u884C\u3001\u673A\u573A\u63A5\u9001\u53CA\u5546\u52A1\u5DEE\u65C5\u3002","Self-Drive Luxury Rental":"\u8C6A\u534E\u81EA\u9A7E\u79DF\u8F66","Take the wheel yourself. We help you with the paperwork you need to drive in China.":"\u4EB2\u81EA\u9A7E\u9A76\u3002\u6211\u4EEC\u534F\u52A9\u60A8\u529E\u7406\u5728\u4E2D\u56FD\u9A7E\u8F66\u6240\u9700\u7684\u624B\u7EED\u3002","Chauffeur Services":"\u4E13\u5C5E\u53F8\u673A\u670D\u52A1","Professional drivers for business days, evenings out and multi-stop itineraries.":"\u4E13\u4E1A\u53F8\u673A\uFF0C\u670D\u52A1\u4E8E\u5546\u52A1\u65E5\u7A0B\u3001\u591C\u95F4\u51FA\u884C\u53CA\u591A\u7AD9\u884C\u7A0B\u3002","Airport Transfers":"\u673A\u573A\u63A5\u9001","Met at arrivals and driven straight to your hotel in comfort.":"\u
