u0430, \u0430\u0442\u043C\u043E\u0441\u0444\u0435\u0440\u043D\u044B\u0439 V10 \u0438 \u0437\u0432\u0443\u043A, \u0434\u043E\u0441\u0442\u043E\u0439\u043D\u044B\u0439 \u043C\u0430\u0448\u0438\u043D\u044B.","Open-top V10 drama. The roof folds away in seconds; the city never sounds the same again.":"\u041A\u0430\u0431\u0440\u0438\u043E\u043B\u0435\u0442 \u0441 V10 \u0438 \u043D\u0430\u0441\u0442\u043E\u044F\u0449\u0438\u043C \u0434\u0440\u0430\u0439\u0432\u043E\u043C. \u041A\u0440\u044B\u0448\u0430 \u0443\u0431\u0438\u0440\u0430\u0435\u0442\u0441\u044F \u0437\u0430 \u0441\u0435\u043A\u0443\u043D\u0434\u044B, \u0438 \u0433\u043E\u0440\u043E\u0434 \u0437\u0432\u0443\u0447\u0438\u0442 \u0441\u043E\u0432\u0441\u0435\u043C \u0438\u043D\u0430\u0447\u0435.","Maranello\u2019s plug-in hybrid flagship, finished in a tricolore livery that commands attention.":"\u041F\u043E\u0434\u043A\u043B\u044E\u0447\u0430\u0435\u043C\u044B\u0439 \u0433\u0438\u0431\u0440\u0438\u0434\u043D\u044B\u0439 \u0444\u043B\u0430\u0433\u043C\u0430\u043D \u0438\u0437 \u041C\u0430\u0440\u0430\u043D\u0435\u043B\u043B\u043E \u0432 \u0442\u0440\u0451\u0445\u0446\u0432\u0435\u0442\u043D\u043E\u0439 \u043B\u0438\u0432\u0440\u0435\u0435, \u043A\u043E\u0442\u043E\u0440\u0430\u044F \u043F\u0440\u0438\u0442\u044F\u0433\u0438\u0432\u0430\u0435\u0442 \u0432\u0437\u0433\u043B\u044F\u0434\u044B.","Compact, agile and hybrid. The new generation of the mid-engined Ferrari berlinetta.":"\u041A\u043E\u043C\u043F\u0430\u043A\u0442\u043D\u044B\u0439, \u043F\u043E\u0432\u043E\u0440\u043E\u0442\u043B\u0438\u0432\u044B\u0439, \u0433\u0438\u0431\u0440\u0438\u0434\u043D\u044B\u0439. \u041D\u043E\u0432\u043E\u0435 \u043F\u043E\u043A\u043E\u043B\u0435\u043D\u0438\u0435 \u0441\u0440\u0435\u0434\u043D\u0435\u043C\u043E\u0442\u043E\u0440\u043D\u043E\u0439 Ferrari.","The open-top 296 in black and gold livery: hybrid performance with the sky as the roof.":"\u041E\u0442\u043A\u0440\u044B\u0442\u044B\u0439 296 \u0432 \u0447\u0451\u0440\u043
